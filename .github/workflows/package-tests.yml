# Install tests of the egroupware-docker packages published on OBS (server:eGroupWare), natively on x86_64 (amd64).
#
# Runs on commits to the packages we have tests for (see paths below), AFTER OBS has built and published them:
# the "plan" job waits for the OBS build of the commit (tests/wait-for-obs.py), then the "install" jobs run.
# Every install job installs the packages in a systemd container with docker-in-docker, see tests/README.md,
# and checks the criteria in tests/guest/verify.sh (containers running, REST API, accounts, web server, Collabora, ...).
# Commits to egroupware-rocketchat run the Rocket.Chat tests: install with an own CA and test the OAuth integration with EGroupware.
# Commits to egroupware-guacamole run the same for Guacamole (OpenID login via EGroupware), commits to egroupware-mail the mail tests
# (Dovecot and Postfix integrated into EGroupware, Debian and Ubuntu only until the RPM is published). Which jobs: tests/plan.sh.
# Image-only releases (no commit here, over 90% of the releases) start a manual run at the end of egroupware/doc/docker/fpm/build.sh (gh workflow run),
# a nightly run of everything on the default distros catches the rest (base images, MariaDB, Nginx, ... changing without any commit).
name: Package install tests

on:
  push:
    branches: [master]
    paths:
      # only packages with tests, commits to other packages are ignored until they have tests too
      # (egroupware-docker-26: older docker packages are not tested, add them here, when we have upgrade tests)
      - 'server:eGroupWare/egroupware-docker-26/**'
      - 'server:eGroupWare/egroupware-collabora-key/**'
      - 'server:eGroupWare/egroupware-rocketchat/**'
      - 'server:eGroupWare/egroupware-guacamole/**'
      - 'server:eGroupWare/egroupware-mail/**'
      - '!**/.osc/**'
  schedule:
    # every night, tests what is currently published on the default distros (the same as a manual run with test=all)
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'What to test: install (egroupware-docker and Collabora, with Nginx and Apache), rocketchat (with OAuth integration), guacamole (with OpenID login), mail, smb (SMB/CIFS shares) or all'
        type: choice
        default: install
        options: [install, rocketchat, guacamole, mail, smb, all]
      distro:
        description: 'Distros to test: default (as on commits), all or a single one. A manual run tests what is currently published'
        type: choice
        default: default
        options: [default, all, rocky-10, rocky-9, ubuntu-26.04, ubuntu-24.04, ubuntu-22.04, debian-13, debian-12, opensuse-16.1, opensuse-16.0]

# a newer commit supersedes the run of an older one, manual and scheduled runs are independent (they used to cancel each other)
concurrency:
  group: package-tests-${{ github.ref }}-${{ github.event_name != 'push' && github.run_id || 'push' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan and wait for OBS
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Which jobs, which packages
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          INPUT_DISTRO: ${{ inputs.distro }}
          INPUT_TEST: ${{ inputs.test || (github.event_name == 'schedule' && 'all') || 'install' }}
          GH_TOKEN: ${{ github.token }}
        run: tests/plan.sh | tee -a "$GITHUB_OUTPUT"

      - name: Wait until OBS has built and published the commit
        if: ${{ steps.plan.outputs.pkgargs != '' }}
        run: tests/wait-for-obs.py ${{ steps.plan.outputs.pkgargs }} ${{ steps.plan.outputs.repos }}

  install:
    name: ${{ matrix.distro }} (${{ matrix.kind == 'base' && matrix.webserver || matrix.kind }})
    needs: plan
    # nothing to test, eg. a commit to egroupware-mail with only RPM distros selected (an empty matrix is an error)
    if: ${{ needs.plan.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # permanently: the 2 latest Debian and Ubuntu releases, only the latest of everything else, each with Nginx and Apache,
      # plus the same distros with Nginx for Rocket.Chat, Guacamole and mail, if they changed, see tests/plan.sh
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Run install test
        working-directory: tests
        shell: bash                          # adds pipefail, so a failing test is not hidden by | tee
        env:
          WEBSERVER: ${{ matrix.webserver }}
          ROCKETCHAT: ${{ matrix.kind == 'rocketchat' && '1' || '' }}
          GUACAMOLE: ${{ matrix.kind == 'guacamole' && '1' || '' }}
          MAIL: ${{ matrix.kind == 'mail' && '1' || '' }}
          SMB: ${{ matrix.kind == 'smb' && '1' || '' }}
          PLATFORM: linux/amd64
          NO_MIRROR: '1'                    # fresh VM for every job, a registry mirror would not help
          MIN_FREE_GB: '0'                  # fresh VM for every job, no leftovers of earlier tests to guard against
          TIMEOUT: '900'
        run: ./run-test.sh ${{ matrix.distro }} install 2>&1 | tee "../test-${{ matrix.distro }}-${{ matrix.kind == 'base' && matrix.webserver || matrix.kind }}.log"

      - name: Upload log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.distro }}-${{ matrix.kind == 'base' && matrix.webserver || matrix.kind }}
          path: test-${{ matrix.distro }}-${{ matrix.kind == 'base' && matrix.webserver || matrix.kind }}.log
