# Install tests of the egroupware-docker packages published on OBS (server:eGroupWare), natively on x86_64 (amd64).
#
# Runs on commits to the packages we have tests for (see paths below), AFTER OBS has built and published them:
# the "plan" job waits for the OBS build of the commit (tests/wait-for-obs.py), then the "install" jobs run.
# Every install job installs the packages in a systemd container with docker-in-docker, see tests/README.md,
# and checks the criteria in tests/guest/verify.sh (containers running, REST API, accounts, web server, Collabora, ...).
name: Package install tests

on:
  push:
    branches: [master]
    paths:
      # only packages with tests, commits to other packages are ignored until they have tests too
      # (egroupware-docker-26: older docker packages are not tested, add them here, when we have upgrade tests)
      - 'server:eGroupWare/egroupware-docker-26/**'
      - 'server:eGroupWare/egroupware-collabora-key/**'
      - '!**/.osc/**'
  workflow_dispatch:
    inputs:
      distro:
        description: 'Distros to test: default (as on commits), all or a single one. A manual run tests what is currently published'
        type: choice
        default: default
        options: [default, all, rocky-10, rocky-9, ubuntu-26.04, ubuntu-24.04, ubuntu-22.04, debian-13, debian-12, opensuse-16.1, opensuse-16.0]

# a newer commit supersedes the run of an older one
concurrency:
  group: package-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan and wait for OBS
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      distros: ${{ steps.plan.outputs.distros }}
    steps:
      - uses: actions/checkout@v4

      - name: Which distros, which packages
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          INPUT_DISTRO: ${{ inputs.distro }}
          GH_TOKEN: ${{ github.token }}
        run: tests/plan.sh | tee -a "$GITHUB_OUTPUT"

      - name: Wait until OBS has built and published the commit
        if: ${{ steps.plan.outputs.pkgargs != '' }}
        run: tests/wait-for-obs.py ${{ steps.plan.outputs.pkgargs }} ${{ steps.plan.outputs.repos }}

  install:
    name: ${{ matrix.distro }} (${{ matrix.webserver }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # permanently: the 2 latest Debian and Ubuntu releases, only the latest of everything else, see tests/plan.sh
        distro: ${{ fromJSON(needs.plan.outputs.distros) }}
        webserver: [nginx, apache]
    steps:
      - uses: actions/checkout@v4

      - name: Run install test
        working-directory: tests
        shell: bash                          # adds pipefail, so a failing test is not hidden by | tee
        env:
          WEBSERVER: ${{ matrix.webserver }}
          PLATFORM: linux/amd64
          NO_MIRROR: '1'                    # fresh VM for every job, a registry mirror would not help
          TIMEOUT: '900'
        run: ./run-test.sh ${{ matrix.distro }} install 2>&1 | tee "../test-${{ matrix.distro }}-${{ matrix.webserver }}.log"

      - name: Upload log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.distro }}-${{ matrix.webserver }}
          path: test-${{ matrix.distro }}-${{ matrix.webserver }}.log
